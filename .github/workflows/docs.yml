name: 📚 Deploy Documentation

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  build-docs:
    name: 📚 Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      repository-lower: ${{ steps.repo.outputs.repository }}
      owner-lower: ${{ steps.repo.outputs.owner }}
      name-lower: ${{ steps.repo.outputs.name }}

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: � Normalize repository identifiers
      id: repo
      run: |
        REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        NAME_LOWER=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')

        echo "repository=$REPO_LOWER" >> "$GITHUB_OUTPUT"
        echo "owner=$OWNER_LOWER" >> "$GITHUB_OUTPUT"
        echo "name=$NAME_LOWER" >> "$GITHUB_OUTPUT"

    - name: �🐍 Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: ⚡ Install uv CLI
      uses: astral-sh/setup-uv@v6
      with:
        activate-environment: false
        enable-cache: true
        cache-suffix: docs

    - name: 📦 Install dependencies
      run: uv sync --group dev

    - name: 🏗️ Build documentation
      run: |
        uv run --group dev sphinx-build -W -b html docs docs/_build/html
        touch docs/_build/html/.nojekyll

    - name: 📤 Upload documentation artifact
      uses: actions/upload-artifact@v4
      with:
        name: docs-preview
        path: docs/_build/html

    - name: 📝 Record documentation summary
      run: |
        {
          echo "## Documentation Build"
          echo "- Repository: https://github.com/${{ steps.repo.outputs.repository }}"
          echo "- Preview: docs-preview artifact; Pages deploys from the release workflow only"
        } >> "$GITHUB_STEP_SUMMARY"
