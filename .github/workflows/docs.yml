name: 📚 Deploy Documentation

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  build-docs:
    name: 📚 Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      repository-lower: ${{ steps.repo.outputs.repository }}
      owner-lower: ${{ steps.repo.outputs.owner }}
      name-lower: ${{ steps.repo.outputs.name }}

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v7

    - name: � Normalize repository identifiers
      id: repo
      run: |
        REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        NAME_LOWER=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')

        echo "repository=$REPO_LOWER" >> "$GITHUB_OUTPUT"
        echo "owner=$OWNER_LOWER" >> "$GITHUB_OUTPUT"
        echo "name=$NAME_LOWER" >> "$GITHUB_OUTPUT"

    - name: Install locked documentation environment
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.76.1
        locked: true
        cache: true
        environments: docs

    - name: Install the local package
      run: pixi run --locked -e docs install-app

    - name: 🏗️ Build documentation
      run: |
        make docs
        touch docs/_build/html/.nojekyll

    - name: 📤 Upload documentation artifact
      uses: actions/upload-artifact@v4
      with:
        name: docs-preview
        path: docs/_build/html

    - name: 📝 Record documentation summary
      run: |
        {
          echo "## Documentation Build"
          echo "- Repository: https://github.com/${{ steps.repo.outputs.repository }}"
          echo "- Preview: docs-preview artifact; Pages deploys from the release workflow only"
        } >> "$GITHUB_STEP_SUMMARY"
