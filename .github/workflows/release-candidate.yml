name: Release candidate gate

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate:
    name: Host, container, wheel and docs release gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.76.1
          locked: true
          cache: true
          environments: dev
      - name: Install the local package for release tests
        run: |
          pixi run --locked -e dev install-app
          pixi run --locked -e docs install-app
      - name: Verify release candidate identity
        run: |
          VERSION=$(python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          python .github/scripts/release_contract.py candidate --version "$VERSION"
      - name: Build and inspect distribution
        run: |
          make build
          pixi run --locked -e dev twine check dist/*
          VERSION=$(python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          python .github/scripts/release_contract.py wheel --version "$VERSION" --wheel dist/*.whl
      - name: Build image from this PR's sources
        run: make docker-build
      - name: Run the real release suite
        run: make test-release DOCKER_TEST_RESOURCE_FLAGS='--cpus 4'
      - name: Upload test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-reports
          path: |
            pytest-host-report.xml
            pytest-container-report.xml
            coverage.xml
          if-no-files-found: warn
