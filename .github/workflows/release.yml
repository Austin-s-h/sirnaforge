name: Release siRNAforge

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate Release Input
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.content }}
      repository-lower: ${{ steps.repo.outputs.repository }}
      owner-lower: ${{ steps.repo.outputs.owner }}
      name-lower: ${{ steps.repo.outputs.name }}
      prerelease: ${{ steps.release_flags.outputs.prerelease }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate tag and checked-out package
      id: version
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        git fetch origin master
        python .github/scripts/release_contract.py tag --version "$VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Normalize repository identifiers
      id: repo
      run: |
        REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        NAME_LOWER=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')

        echo "repository=$REPO_LOWER" >> $GITHUB_OUTPUT
        echo "owner=$OWNER_LOWER" >> $GITHUB_OUTPUT
        echo "name=$NAME_LOWER" >> $GITHUB_OUTPUT

    - name: Gather project statistics
      id: stats
      run: |
        # Count code files and tests
        PY_FILES=$(find src/ -name "*.py" | wc -l)
        TEST_FILES=$(find tests/ -name "*.py" | wc -l)
        TOTAL_LINES=$(find src/ -name "*.py" -exec wc -l {} + | tail -1 | awk '{print $1}')

        # Get Docker image size (if available locally)
        DOCKER_SIZE="Unknown"
        if docker image inspect sirnaforge:latest >/dev/null 2>&1; then
          DOCKER_SIZE=$(docker image inspect sirnaforge:latest --format='{{.Size}}' | numfmt --to=iec-i --suffix=B)
        fi

        # Count CLI commands available
        CLI_COMMANDS="7"  # search, workflow, design, validate, config, cache, version

        echo "py_files=$PY_FILES" >> $GITHUB_OUTPUT
        echo "test_files=$TEST_FILES" >> $GITHUB_OUTPUT
        echo "total_lines=$TOTAL_LINES" >> $GITHUB_OUTPUT
        echo "docker_size=$DOCKER_SIZE" >> $GITHUB_OUTPUT
        echo "cli_commands=$CLI_COMMANDS" >> $GITHUB_OUTPUT

    - name: Generate comprehensive release notes
      id: changelog
      env:
        VERSION: ${{ steps.version.outputs.version }}
        PY_FILES: ${{ steps.stats.outputs.py_files }}
        TEST_FILES: ${{ steps.stats.outputs.test_files }}
        TOTAL_LINES: ${{ steps.stats.outputs.total_lines }}
        CLI_COMMANDS: ${{ steps.stats.outputs.cli_commands }}
        DOCKER_SIZE: ${{ steps.stats.outputs.docker_size }}
        REGISTRY: ${{ env.REGISTRY }}
        REPOSITORY_LOWER: ${{ steps.repo.outputs.repository }}
        OWNER_LOWER: ${{ steps.repo.outputs.owner }}
        NAME_LOWER: ${{ steps.repo.outputs.name }}
      run: |
        python .github/scripts/generate_release_notes.py
    - name: Upload exact release notes
      uses: actions/upload-artifact@v4
      with:
        name: release-notes-${{ steps.version.outputs.version }}
        path: release_notes.md

    - name: Classify release version
      id: release_flags
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        python <<'PY'
        import os
        prerelease = "true" if "rc" in os.environ["VERSION"] else "false"
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
            handle.write(f"prerelease={prerelease}\n")
        PY

  # Call the main CI workflow to ensure quality
  run-ci:
    name: Run Main CI Pipeline
    needs: validate-release
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci.yml

  # Run comprehensive release tests with full coverage
  test-release:
    name: Comprehensive Release Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SIRNAFORGE_NEXTFLOW_IMAGE: sirnaforge:latest
    needs: [ validate-release, run-ci, build-docker, build-artifacts ]
    if: needs.run-ci.result == 'success' && needs.build-docker.result == 'success'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up locked release-test environments
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.76.1
        locked: true
        cache: true
        environments: dev

    - name: Install the local package
      run: |
        pixi run --locked -e dev install-app
        pixi run --locked -e docs install-app

    - name: Download the tested distribution
      uses: actions/download-artifact@v4
      with:
        name: python-dist-${{ needs.validate-release.outputs.version }}
        path: dist/

    - name: Download Docker image
      uses: actions/download-artifact@v4
      with:
        name: docker-image-${{ needs.validate-release.outputs.version }}
        path: /tmp/

    - name: Load Docker image for testing
      run: |
        # Load the built image
        docker load --input /tmp/sirnaforge-image.tar

        # Tag the image to match what the Makefile expects (sirnaforge:latest)
        REGISTRY_IMAGE="${{ env.REGISTRY }}/${{ needs.validate-release.outputs.repository-lower }}:${{ needs.validate-release.outputs.version }}"
        docker tag "$REGISTRY_IMAGE" sirnaforge:latest
        docker tag "$REGISTRY_IMAGE" sirnaforge:${{ needs.validate-release.outputs.version }}

        echo "Docker image loaded and tagged for testing"
        docker images | grep sirnaforge

    - name: Verify the loaded image and tested wheel
      run: |
        test "$(docker image inspect sirnaforge:latest --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^BUILD_WHEEL_SHA256=//p')" = "$(make -s print-wheel-sha)"
        test "$(docker image inspect sirnaforge:latest --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^BUILD_SRC_FINGERPRINT=//p')" = "$(make -s print-src-fingerprint)"

    - name: Run comprehensive test suite with coverage
      run: make test-release DOCKER_TEST_RESOURCE_FLAGS='--cpus 4'

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-release-${{ needs.validate-release.outputs.version }}
        path: |
          coverage.xml
          htmlcov/
          pytest-host-report.xml
          pytest-container-report.xml
        retention-days: 30

    - name: Coverage summary
      if: always()
      run: |
        echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        pixi run --locked -e dev coverage report --format=markdown >> $GITHUB_STEP_SUMMARY || echo "Coverage report not available" >> $GITHUB_STEP_SUMMARY

  # Build Python distribution artifacts once (reusable by PyPI)
  build-artifacts:
    name: Build Python Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ validate-release, run-ci ]
    outputs:
      version: ${{ needs.validate-release.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Set up locked build tools
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.76.1
        locked: true
        cache: true
        environments: dev
    - name: Build (sdist + wheel)
      run: |
        make build
        ls -lh dist/
    - name: Verify metadata (twine check)
      run: |
        pixi run --locked -e dev twine check dist/*
        python .github/scripts/release_contract.py wheel --version "${{ needs.validate-release.outputs.version }}" --wheel dist/*.whl
    - name: Test the wheel outside Pixi
      run: |
        python -m venv "$RUNNER_TEMP/release-wheel"
        "$RUNNER_TEMP/release-wheel/bin/python" -m pip install dist/*.whl
        "$RUNNER_TEMP/release-wheel/bin/python" -m pip check
        cd "$RUNNER_TEMP"
        ./release-wheel/bin/sirnaforge --help
    - name: Upload dist artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-dist-${{ needs.validate-release.outputs.version }}
        path: dist/
        include-hidden-files: true
        retention-days: 7

  # Build and test Docker images only after CI passes
  build-docker:
    name: Build & Test Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [ validate-release, run-ci, build-artifacts ]
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download the tested distribution
      uses: actions/download-artifact@v4
      with:
        name: python-dist-${{ needs.validate-release.outputs.version }}
        path: dist/

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Generate Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ needs.validate-release.outputs.repository-lower }}
        tags: |
          type=raw,value=${{ needs.validate-release.outputs.version }}
        labels: |
          org.opencontainers.image.title=siRNAforge
          org.opencontainers.image.description=siRNA design and analysis toolkit
          org.opencontainers.image.version=${{ needs.validate-release.outputs.version }}
          org.opencontainers.image.url=https://github.com/${{ needs.validate-release.outputs.owner-lower }}/${{ needs.validate-release.outputs.name-lower }}
          org.opencontainers.image.source=https://github.com/${{ needs.validate-release.outputs.owner-lower }}/${{ needs.validate-release.outputs.name-lower }}

    - name: Compute image build arguments
      id: buildargs
      run: |
        echo "src-fingerprint=$(make -s print-src-fingerprint)" >> "$GITHUB_OUTPUT"
        wheel_sha=$(make -s print-wheel-sha)
        echo "wheel-sha=$wheel_sha" >> "$GITHUB_OUTPUT"

    - name: Build Docker image (don't push yet)
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile
        push: false
        build-args: |
          VERSION=${{ needs.validate-release.outputs.version }}
          SRC_FINGERPRINT=${{ steps.buildargs.outputs.src-fingerprint }}
          WHEEL_SHA256=${{ steps.buildargs.outputs.wheel-sha }}
        platforms: linux/amd64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        outputs: type=docker,dest=/tmp/sirnaforge-image.tar
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image-${{ needs.validate-release.outputs.version }}
        path: /tmp/sirnaforge-image.tar
        retention-days: 1

  # A draft cannot be mistaken for a completed public release.
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ validate-release, test-release, build-artifacts, build-release-docs ]
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: release-notes-${{ needs.validate-release.outputs.version }}
    - name: Create draft GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.validate-release.outputs.version }}
        PRERELEASE: ${{ needs.validate-release.outputs.prerelease }}
      run: |
        flags=()
        if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
        gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
          --title "siRNAforge v$VERSION" --notes-file release_notes.md "${flags[@]}"

  # Publish the verified distribution using PyPI Trusted Publishing.
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [ validate-release, run-ci, create-release, build-artifacts ]
    if: ${{ needs.run-ci.result == 'success' && needs.create-release.result == 'success' && needs.build-artifacts.result == 'success' }}
    permissions:
      id-token: write # Required for PyPI trusted publisher
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Download dist artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-dist-${{ needs.validate-release.outputs.version }}
        path: dist/

    - name: Keep only distribution files in the upload directory
      run: rm -f dist/.pixi-build
    - name: Publish to PyPI (Trusted Publisher)
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        print-hash: true
        verbose: true
        skip-existing: false


  # Build docs from the same tagged tree before creating a draft.
  build-release-docs:
    name: Build Release Docs
    runs-on: ubuntu-latest
    needs: [ validate-release, run-ci ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up locked documentation tools
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.76.1
        locked: true
        cache: true
        environments: docs
    - name: Install the local package
      run: pixi run --locked -e docs install-app
    - name: Build documentation (release)
      run: |
        export SIRNAFORGE_RELEASE_VERSION=${{ needs.validate-release.outputs.version }}
        make docs
        touch docs/_build/html/.nojekyll
    - name: Upload docs artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-docs-${{ needs.validate-release.outputs.version }}
        path: docs/_build/html
        retention-days: 7

  deploy-release-docs:
    name: Deploy Release Docs
    runs-on: ubuntu-latest
    needs: [ validate-release, build-release-docs, final-integration-test ]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Download docs artifact
      uses: actions/download-artifact@v4
      with:
        # Use normalized version (without leading 'v') from validate-release to match upload name
        name: release-docs-${{ needs.validate-release.outputs.version }}
        path: docs/_build/html
    - name: Upload pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/_build/html
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # Publish Docker images only after release tests pass and the release is created
  publish-docker:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ validate-release, build-docker, test-release, create-release, publish-pypi ]
    permissions:
      contents: read
      packages: write
    outputs:
      image-id: ${{ steps.push.outputs.image-id }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Download Docker image
      uses: actions/download-artifact@v4
      with:
        name: docker-image-${{ needs.validate-release.outputs.version }}
        path: /tmp/

    - name: Load and push Docker image
      id: push
      run: |
        # Load the image
        docker load --input /tmp/sirnaforge-image.tar

        # Push version-specific tag
        VERSION_TAG="${{ env.REGISTRY }}/${{ needs.validate-release.outputs.repository-lower }}:${{ needs.validate-release.outputs.version }}"
        echo "image-id=$(docker image inspect "$VERSION_TAG" --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
        docker push "$VERSION_TAG"

        echo "Pushed version tag only; latest moves after publication checks"


  # Final integration test with published images
  final-integration-test:
    name: Final Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [ validate-release, create-release, publish-docker, publish-pypi, build-artifacts ]

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v4
      with:
        name: python-dist-${{ needs.validate-release.outputs.version }}
        path: dist/
    - name: Check PyPI distribution against the tested wheel and install it
      run: |
        VERSION="${{ needs.validate-release.outputs.version }}"
        python .github/scripts/release_contract.py published --version "$VERSION" --wheel dist/*.whl
        python -m venv .release-venv
        .release-venv/bin/python -m pip install "sirnaforge==$VERSION"
        .release-venv/bin/python -c 'import importlib.metadata,os; assert importlib.metadata.version("sirnaforge") == os.environ["VERSION"]'
        .release-venv/bin/sirnaforge --help
      env:
        VERSION: ${{ needs.validate-release.outputs.version }}
    - name: Test published Docker image
      run: |
        VERSION="${{ needs.validate-release.outputs.version }}"
        IMAGE_TAG="${{ env.REGISTRY }}/${{ needs.validate-release.outputs.repository-lower }}:${VERSION}"

        echo "Testing published image from ${{ env.REGISTRY }}..."
        docker pull "$IMAGE_TAG"
        test "$(docker image inspect "$IMAGE_TAG" --format '{{.Id}}')" = "${{ needs.publish-docker.outputs.image-id }}"

        echo "Testing CLI functionality..."
        docker run --rm "$IMAGE_TAG" sirnaforge --help

        echo "Testing version command..."
        docker run --rm "$IMAGE_TAG" python -c 'import importlib.metadata,os; assert importlib.metadata.version("sirnaforge") == os.environ["BUILD_VERSION"]'

        echo "Published image works correctly!"

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [ validate-release, create-release, publish-pypi, publish-docker, final-integration-test, deploy-release-docs ]
    permissions:
      contents: write
    steps:
    - name: Publish validated draft and read it back
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.validate-release.outputs.version }}
      run: |
        gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
        test "$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = false

  publish-latest:
    name: Advance stable image tag
    runs-on: ubuntu-latest
    needs: [ validate-release, publish-release ]
    if: needs.validate-release.outputs.prerelease != 'true'
    permissions:
      packages: write
    steps:
    - uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Point latest at the verified versioned image
      run: |
        IMAGE="${{ env.REGISTRY }}/${{ needs.validate-release.outputs.repository-lower }}"
        docker pull "$IMAGE:${{ needs.validate-release.outputs.version }}"
        docker tag "$IMAGE:${{ needs.validate-release.outputs.version }}" "$IMAGE:latest"
        docker push "$IMAGE:latest"
        docker image rm "$IMAGE:latest"
        docker pull "$IMAGE:latest"
        test "$(docker image inspect "$IMAGE:latest" --format '{{.Id}}')" = \
          "$(docker image inspect "$IMAGE:${{ needs.validate-release.outputs.version }}" --format '{{.Id}}')"

  finalize-release:
    name: Release Complete
    runs-on: ubuntu-latest
    needs: [ validate-release, publish-release, publish-latest ]
    if: always()
    steps:
    - name: Require a published release and appropriate image promotion
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.validate-release.outputs.version }}
        RELEASE_STATUS: ${{ needs.publish-release.result }}
        LATEST_STATUS: ${{ needs.publish-latest.result }}
        PRERELEASE: ${{ needs.validate-release.outputs.prerelease }}
      run: |
        test "$RELEASE_STATUS" = success
        if [ "$PRERELEASE" = true ]; then
          test "$LATEST_STATUS" = skipped
        else
          test "$LATEST_STATUS" = success
        fi
        test "$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = false
        echo "Verified release: https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
