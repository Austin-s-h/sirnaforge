name: 🐳 Docker (dev)

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docker/**'
      - 'pyproject.toml'
      - 'pixi.toml'
      - 'pixi.lock'
      - 'scripts/check_pixi_environment.py'
      - 'Makefile'
      - '.github/workflows/docker-dev.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & test image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔡 Normalize repository identifiers
        id: repo
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repository=$REPO_LOWER" >> $GITHUB_OUTPUT

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: 🔐 Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository }}
          tags: |
            type=raw,value=dev
            type=raw,value=sha-${{ steps.repo.outputs.short_sha }}

      - name: Set up locked build tools
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.76.1
          locked: true
          cache: true
          environments: dev

      - name: Build and check the wheel
        run: |
          make build
          pixi run --locked -e dev twine check dist/*

      - name: 🧮 Compute image build args
        id: buildargs
        run: |
          echo "version=$(make -s print-version)" >> "$GITHUB_OUTPUT"
          echo "src-fingerprint=$(make -s print-src-fingerprint)" >> "$GITHUB_OUTPUT"
          wheel_sha=$(make -s print-wheel-sha)
          echo "wheel-sha=$wheel_sha" >> "$GITHUB_OUTPUT"

      # Built and tested before it is pushed. The container tier is the only place the installed CLI,
      # the report (#103) and the .nf evidence emission (#100) run for real, and until now it ran in no
      # workflow at all. Push the loaded image after its smoke checks and the locked container suite.
      - name: 🐳 Build Docker image (load locally, do not push yet)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          build-args: |
            VERSION=${{ steps.buildargs.outputs.version }}
            SRC_FINGERPRINT=${{ steps.buildargs.outputs.src-fingerprint }}
            WHEEL_SHA256=${{ steps.buildargs.outputs.wheel-sha }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `docker-ensure` compares BUILD_VERSION and BUILD_SRC_FINGERPRINT against the tree, so the
      # build-args above are what stop it rebuilding the image we just built.
      - name: 🏷️ Tag as sirnaforge:latest for the container suite
        run: |
          REGISTRY_IMAGE="${{ env.REGISTRY }}/${{ steps.repo.outputs.repository }}:dev"
          docker tag "$REGISTRY_IMAGE" sirnaforge:latest
          docker tag "$REGISTRY_IMAGE" sirnaforge:${{ steps.buildargs.outputs.version }}

      - name: 🧪 Container suite (Make target)
        run: |
          make docker-smoke DOCKER_TEST_RESOURCE_FLAGS='--cpus=4 --memory=8g --memory-swap=8g'
          make docker-test DOCKER_TEST_RESOURCE_FLAGS='--network none --cpus=4 --memory=8g --memory-swap=8g'

      - name: Verify the tested image is the publication candidate
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository }}:dev
        run: test "$(docker image inspect "$IMAGE" --format '{{.Id}}')" = "$(docker image inspect sirnaforge:latest --format '{{.Id}}')"

      - name: 🐳 Push the tested Docker image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

      - name: ✅ Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## 🐳 Dev Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: dev" >> $GITHUB_STEP_SUMMARY
          echo "- Tags:" >> $GITHUB_STEP_SUMMARY
          echo "  - ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository }}:dev" >> $GITHUB_STEP_SUMMARY
          echo "  - ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository }}:sha-${{ steps.repo.outputs.short_sha }}" >> $GITHUB_STEP_SUMMARY
