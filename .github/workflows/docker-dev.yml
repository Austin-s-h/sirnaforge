name: 🐳 Docker (dev)

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push dev image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔡 Normalize repository identifiers
        id: repo
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repository=$REPO_LOWER" >> $GITHUB_OUTPUT

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository }}
          tags: |
            type=raw,value=dev
            type=raw,value=sha-${{ steps.repo.outputs.short_sha }}

      # uv is needed only so the Makefile can read the project version; the build itself does not use it.
      - name: 🐍 Install uv CLI
        uses: astral-sh/setup-uv@v6
        with:
          activate-environment: false
          enable-cache: true
          cache-suffix: docker-dev

      - name: 🧮 Compute image build args
        id: buildargs
        run: |
          echo "version=$(uv run python -c 'from sirnaforge import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"
          echo "src-fingerprint=$(make -s print-src-fingerprint)" >> "$GITHUB_OUTPUT"

      # Built and tested before it is pushed. The container tier is the only place the installed CLI,
      # the report (#103) and the .nf evidence emission (#100) run for real, and until now it ran in no
      # workflow at all: this job pushed an untested image, and the only automated `make test-release`
      # is tag-triggered. The second build-push step below is a cache hit, so testing first is cheap.
      - name: 🐳 Build Docker image (load locally, do not push yet)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          build-args: |
            VERSION=${{ steps.buildargs.outputs.version }}
            SRC_FINGERPRINT=${{ steps.buildargs.outputs.src-fingerprint }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `docker-ensure` compares BUILD_VERSION and BUILD_SRC_FINGERPRINT against the tree, so the
      # build-args above are what stop it rebuilding the image we just built.
      - name: 🏷️ Tag as sirnaforge:latest for the container suite
        run: |
          REGISTRY_IMAGE="${{ env.REGISTRY }}/${{ steps.repo.outputs.repository }}:dev"
          docker tag "$REGISTRY_IMAGE" sirnaforge:latest
          docker tag "$REGISTRY_IMAGE" sirnaforge:${{ steps.buildargs.outputs.version }}

      - name: 🧪 Container suite (Make target)
        run: make docker-test

      - name: 🐳 Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.buildargs.outputs.version }}
            SRC_FINGERPRINT=${{ steps.buildargs.outputs.src-fingerprint }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Summary
        run: |
          echo "## 🐳 Dev Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: dev" >> $GITHUB_STEP_SUMMARY
          echo "- Tags:" >> $GITHUB_STEP_SUMMARY
          echo "  - ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository }}:dev" >> $GITHUB_STEP_SUMMARY
          echo "  - ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository }}:sha-${{ steps.repo.outputs.short_sha }}" >> $GITHUB_STEP_SUMMARY
