# Investigation only: default dependency/workflow files are intentionally untouched.
[workspace]
name = "sirnaforge-pixi-review"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
openjdk = ">=17,<18"
nextflow = "==25.10.2"
bwa-mem2 = "==2.2.1"
samtools = "==1.24"
viennarna = "==2.7.0"
pysam = ">=0.23.0"

# Keep the installed Conda launcher/framework together. The local project's PyPI
# nextflow dependency must be resolved against Conda ownership before adoption.
[feature.application.pypi-dependencies]
sirnaforge = { path = "../../..", editable = true }

# The project's broad PyPI requirement otherwise selects a newer Nextflow
# launcher than the Conda-provided framework JAR. Keep both on the locked
# runtime version so an editable application install remains offline-capable.
[feature.application.pypi-options.dependency-overrides]
nextflow = "==25.10.2"

# Point the PyPI launcher at the exact Conda framework JAR supplied above.
[feature.application.activation.env]
NXF_DIST = "$CONDA_PREFIX/share/nextflow/dist"

[feature.test.pypi-dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=1.1.0"
pytest-mock = ">=3.15"
pytest-xdist = ">=3.8"
jsonschema = ">=4.0"

[environments]
runtime = { features = [], no-default-feature = false }
application = { features = ["application"] }
tests = { features = ["application", "test"] }

[tasks]
python-version = "python --version"
nextflow-version = "nextflow -version"
