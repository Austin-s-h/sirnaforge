# Investigation only: default dependency/workflow files are intentionally untouched.
[workspace]
name = "sirnaforge-pixi-review"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pip = "*"
hatchling = "*"
editables = "*"
openjdk = "==24.0.2"
nextflow = "==26.10.3"
bwa-mem2 = "==2.2.1"
bwa-mem3 = "==0.15.0"
samtools = "==1.24"
viennarna = "==2.7.2"
pysam = ">=0.23.0"
awscli = "==2.38.1"
curl = "*"
wget = "*"
jq = "*"
pigz = "*"
htslib = "*"
micromamba = "*"
biopython = ">=1.84"
pandas = ">=2.3.0"
numpy = ">=1.26.0,<2.5"
requests = ">=2.32.0"
pyahocorasick = ">=2.1.0"
click = ">=8.0.0"
pydantic = ">=2.11.0"
rich = ">=14.0.0"
typer = ">=0.17.0"
aiohttp = ">=3.12.0"
httpx = ">=0.28.0"
pandera = ">=0.26.0"
psutil = ">=6.0.0"
jinja2 = ">=3.1.0"

# fm-index has no candidate on the declared Conda channels. PyArrow stays with
# the production PyPI/uv owner and avoids a Conda solver conflict with AWS CLI.
[pypi-dependencies]
fm-index = ">=2.3.4"
pyarrow = ">=18.0.0"

# Point the Conda launcher at the exact framework JAR supplied above for offline startup.
[feature.application.activation.env]
NXF_DIST = "$CONDA_PREFIX/share/nextflow/dist"

[feature.test.pypi-dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=1.1.0"
pytest-mock = ">=3.15"
pytest-xdist = ">=3.8"
jsonschema = ">=4.0"

[environments]
runtime = { features = [], no-default-feature = false }
application = { features = ["application"] }
tests = { features = ["application", "test"] }

[tasks]
python-version = "python --version"
nextflow-version = "nextflow -version"
install-app = "python -m pip install --no-deps --no-build-isolation --editable ../../.."
