repos:
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: pixi run --locked -e dev trailing-whitespace-fixer
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]
      - id: end-of-file-fixer
        name: fix end of files
        entry: pixi run --locked -e dev end-of-file-fixer
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]
      - id: check-yaml
        name: check YAML
        entry: pixi run --locked -e dev check-yaml
        language: system
        types: [yaml]
      - id: check-added-large-files
        name: check for added large files
        entry: pixi run --locked -e dev check-added-large-files
        language: system
        stages: [pre-commit, pre-push, manual]
      - id: check-merge-conflict
        name: check for merge conflicts
        entry: pixi run --locked -e dev check-merge-conflict
        language: system
        types: [text]
      - id: debug-statements
        name: check for debug statements
        entry: pixi run --locked -e dev debug-statement-hook
        language: system
        types: [python]
      - id: ruff
        name: ruff
        entry: pixi run --locked -e dev ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: ruff format
        entry: pixi run --locked -e dev ruff format
        language: system
        types_or: [python, pyi, jupyter]
      - id: mypy
        name: mypy
        entry: pixi run --locked -e dev mypy src scripts
        language: system
        pass_filenames: false
      - id: pytest-check
        name: pytest
        entry: pixi run --locked -e dev pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: nextflow-lint
        name: nextflow-lint
        entry: pixi run --locked -e dev bash -c 'if command -v nextflow >/dev/null 2>&1; then find src/sirnaforge/pipeline/nextflow/workflows -name "*.nf" -exec nextflow lint {} \; 2>/dev/null || true; else echo "⚠️  Nextflow not found, skipping lint"; fi'
        language: system
        files: \.nf$
        pass_filenames: false
