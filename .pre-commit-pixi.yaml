repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: pixi run --locked -e dev ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: ruff format
        entry: pixi run --locked -e dev ruff format
        language: system
        types_or: [python, pyi, jupyter]
      - id: mypy
        name: mypy
        entry: pixi run --locked -e dev mypy src scripts
        language: system
        pass_filenames: false
      - id: pytest-check
        name: pytest
        entry: pixi run --locked -e dev pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
